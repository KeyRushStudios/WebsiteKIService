<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dona</title>
<style>
:root{--bg:#212121;--side:#171717;--card:#2f2f2f;--text:#ececec;--muted:#9b9b9b;--acc:#10a37f;--line:#3a3a3a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:18px}
.right{display:flex;gap:10px;align-items:center;position:relative}
.icon{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.menu{position:absolute;top:44px;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;z-index:5;min-width:140px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:8px}
.menu button:hover,.menu button.on{background:var(--side)}
#count{font-size:13px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:760px;margin:0 auto}
.msg{margin:0 0 22px;display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.user .bubble{background:var(--card);padding:10px 16px;border-radius:20px}
pre{background:#0d0d0d;border-radius:12px;padding:14px;overflow-x:auto;font-size:13.5px;line-height:1.5;white-space:pre;margin:10px 0}
.empty{text-align:center;margin-top:18vh;color:var(--muted)}
.empty h1{color:var(--text);font-size:28px;font-weight:600;margin:0 0 8px}
footer{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.box{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--card);border-radius:26px;padding:8px 8px 8px 18px}
textarea{flex:1;background:none;border:0;color:var(--text);font:inherit;resize:none;max-height:160px;padding:8px 0;outline:none}
.send{background:var(--text);color:#000;border:0;border-radius:50%;width:38px;height:38px;font-size:18px}
.send:disabled{opacity:.35}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:24px}
.card p{margin:0;color:var(--muted);font-size:14px}
input{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit}
.btn{background:var(--acc);border:0;border-radius:12px;padding:12px;color:#fff;font-weight:600}
.err{color:#ff7b72;font-size:14px;min-height:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h2 id="t_login"></h2><p id="t_free"></p>
    <div id="s1" class="card" style="max-width:none">
      <input id="email" type="email" autocomplete="email" inputmode="email">
      <button class="btn" id="b_code"></button>
    </div>
    <div id="s2" class="card hidden" style="max-width:none">
      <p id="t_sent"></p>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      <button class="btn" id="b_verify"></button>
    </div>
    <div class="err" id="err"></div>
    <div style="text-align:center"><button class="icon" id="lang2">🌐 <span class="lc"></span></button></div>
  </div>
</div>

<header>
  <span class="logo">Dona</span>
  <div class="right">
    <span id="count"></span>
    <button class="icon" id="lang" aria-label="Language">🌐 <span class="lc"></span></button>
    <div class="menu" id="menu">
      <button data-l="pl">Polski</button><button data-l="en">English</button><button data-l="de">Deutsch</button>
    </div>
    <button class="icon" id="out" aria-label="Logout">⎋</button>
  </div>
</header>
<main id="chat"><div class="wrap" id="log"></div></main>
<footer>
  <div class="box">
    <textarea id="in" rows="1"></textarea>
    <button class="send" id="send" aria-label="Send">↑</button>
  </div>
  <div class="hint" id="hint"></div>
</footer>

<script>
const T={
pl:{login:'Zaloguj się do Dony',free:'Za darmo, bez karty kredytowej.',email:'Twój e-mail',getcode:'Wyślij kod',sent:'Wysłaliśmy 6-cyfrowy kod na Twój e-mail.',code:'Kod',verify:'Potwierdź',ph:'Opisz stronę, którą mam zbudować…',hello:'W czym mogę pomóc?',sub:'Opisz stronę, a Dona napisze HTML, CSS i JavaScript.',hint:'Używaj tylko treści, do których masz prawa autorskie.',bad:'Nieprawidłowy lub wygasły kod.',mail:'Nieprawidłowy e-mail lub błąd wysyłki.',wait:'Poczekaj minutę przed kolejnym kodem.',limit:'Limit 100 wiadomości na dziś osiągnięty. Wróć jutro.',model:'Błąd modelu. Spróbuj ponownie.',left:'dziś'},
en:{login:'Log in to Dona',free:'Free, no credit card needed.',email:'Your email',getcode:'Send code',sent:'We sent a 6-digit code to your email.',code:'Code',verify:'Confirm',ph:'Describe the website I should build…',hello:'How can I help?',sub:'Describe a page and Dona writes the HTML, CSS and JavaScript.',hint:'Only use content you have the rights to.',bad:'Wrong or expired code.',mail:'Invalid email or sending failed.',wait:'Wait a minute before requesting another code.',limit:'Daily limit of 100 messages reached. Come back tomorrow.',model:'Model error. Please try again.',left:'today'},
de:{login:'Bei Dona anmelden',free:'Kostenlos, ohne Kreditkarte.',email:'Deine E-Mail',getcode:'Code senden',sent:'Wir haben einen 6-stelligen Code an deine E-Mail geschickt.',code:'Code',verify:'Bestätigen',ph:'Beschreibe die Webseite, die ich bauen soll…',hello:'Wobei kann ich helfen?',sub:'Beschreibe eine Seite, Dona schreibt HTML, CSS und JavaScript.',hint:'Nutze nur Inhalte, an denen du die Rechte hast.',bad:'Falscher oder abgelaufener Code.',mail:'Ungültige E-Mail oder Versand fehlgeschlagen.',wait:'Warte eine Minute, bevor du einen neuen Code anforderst.',limit:'Tageslimit von 100 Nachrichten erreicht. Komm morgen wieder.',model:'Modellfehler. Bitte erneut versuchen.',left:'heute'}
};
const $=id=>document.getElementById(id);
let lang=localStorage.getItem('lang')||'pl', token=localStorage.getItem('token'), email='', msgs=[], used=0, limit=100;
const t=k=>T[lang][k];

function applyLang(){
  document.documentElement.lang=lang;
  $('t_login').textContent=t('login');$('t_free').textContent=t('free');
  $('email').placeholder=t('email');$('b_code').textContent=t('getcode');
  $('t_sent').textContent=t('sent');$('code').placeholder=t('code');$('b_verify').textContent=t('verify');
  $('in').placeholder=t('ph');$('hint').textContent=t('hint');
  document.querySelectorAll('.lc').forEach(e=>e.textContent=lang.toUpperCase());
  document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  count();render();
}
function setLang(l){lang=l;localStorage.setItem('lang',l);$('menu').classList.remove('open');applyLang()}
$('lang').onclick=()=>$('menu').classList.toggle('open');
$('lang2').onclick=()=>setLang(lang==='pl'?'en':lang==='en'?'de':'pl');
document.querySelectorAll('#menu button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

function count(){$('count').textContent=token?`${used}/${limit} ${t('left')}`:''}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmt(s){
  return s.split(/```/).map((p,i)=>i%2?'<pre>'+esc(p.replace(/^\w*\n/,''))+'</pre>':esc(p)).join('');
}
function render(){
  const log=$('log');
  if(!msgs.length){log.innerHTML=`<div class="empty"><h1>${t('hello')}</h1><div>${t('sub')}</div></div>`;return}
  log.innerHTML=msgs.map(m=>`<div class="msg ${m.role}"><div class="bubble">${fmt(m.content)}</div></div>`).join('');
  $('chat').scrollTop=$('chat').scrollHeight;
}

async function api(path,body,auth){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  return {ok:r.ok,status:r.status,j};
}
function showApp(){$('login').classList.add('hidden');count()}
function logout(){localStorage.removeItem('token');token=null;msgs=[];$('login').classList.remove('hidden');$('s1').classList.remove('hidden');$('s2').classList.add('hidden');count();render()}
$('out').onclick=logout;

$('b_code').onclick=async()=>{
  $('err').textContent='';email=$('email').value.trim();
  const r=await api('/api/request-code',{email});
  if(r.ok){$('s1').classList.add('hidden');$('s2').classList.remove('hidden')}
  else $('err').textContent=r.status===429?t('wait'):t('mail');
};
$('b_verify').onclick=async()=>{
  $('err').textContent='';
  const r=await api('/api/verify',{email,code:$('code').value});
  if(r.ok){token=r.j.token;localStorage.setItem('token',token);await init()}
  else $('err').textContent=t('bad');
};
async function init(){
  if(!token)return;
  const r=await api('/api/me',null,true);
  if(!r.ok)return logout();
  used=r.j.used;limit=r.j.limit;showApp();
}

async function send(){
  const text=$('in').value.trim();if(!text||$('send').disabled)return;
  $('in').value='';$('in').style.height='auto';
  msgs.push({role:'user',content:text});render();$('send').disabled=true;
  const r=await api('/api/chat',{messages:msgs},true);
  if(r.ok){msgs.push({role:'assistant',content:r.j.reply});used=r.j.used;limit=r.j.limit}
  else if(r.status===401)return logout();
  else msgs.push({role:'assistant',content:r.status===429?t('limit'):t('model')});
  $('send').disabled=false;count();render();
}
$('send').onclick=send;
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});

applyLang();init();
</script>
</body>
</html>
